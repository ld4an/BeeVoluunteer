<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Edit Event | BeeVolunteer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Edit Event</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="event_name" class="form-label">Event Name</label>
            <input type="text" class="form-control" id="event_name" name="event_name" value="{{ event.name }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ event.description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="event_date" class="form-label">Date and Time</label>
            <input type="datetime-local" class="form-control" id="event_date" name="event_date"
                   value="{{ event.date|date:'Y-m-d\\TH:i' }}" required>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" value="{{ event.location }}">
        </div>
        <div class="mb-3">
            <label for="volunteer_count" class="form-label">Max Volunteers</label>
            <input type="number" class="form-control" id="volunteer_count" name="volunteer_count" value="{{ event.max_volunteers }}">
        </div>
        <div class="d-flex justify-content-between">
            <a href="{% url 'organization_homepage' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
</body>
</html>
